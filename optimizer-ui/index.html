<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTA Optimizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/optimizer/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="/optimizer/static/app.js" type="module" defer></script>
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a href="/" class="header__back">← Trang chủ</a>
      <div>
        <h1 class="header__title">MTA Schedule Optimizer</h1>
        <p class="header__meta" id="model-meta">Đang tải…</p>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="panel panel--form">
      <form id="opt-form">
        <div class="form-grid">
          <label class="control">
            <span class="control__label">Tuyến</span>
            <select id="route-id" class="control__input" required></select>
          </label>

          <div class="control">
            <span class="control__label">Nguồn demand</span>
            <div class="mode-tabs" role="tablist">
              <button type="button" class="mode-tab is-active" data-mode="date">Theo ngày</button>
              <button type="button" class="mode-tab" data-mode="scenario">Kịch bản thủ công</button>
            </div>
          </div>

          <label id="date-field" class="control">
            <span class="control__label">Chọn ngày</span>
            <input type="date" id="selected-date" class="control__input" />
          </label>
        </div>

        <!-- Profile sau khi crawl -->
        <div id="date-profile" class="profile" hidden>
          <div class="profile__head">
            <div>
              <p class="profile__eyebrow">Kịch bản tự động</p>
              <h2 class="profile__title" id="profile-title">—</h2>
              <p class="profile__source" id="profile-source"></p>
            </div>
            <div class="profile__stats" id="profile-stats"></div>
          </div>
          <div class="chips" id="profile-chips"></div>
        </div>

        <div id="profile-loading" class="profile profile--loading" hidden>
          <div class="spinner"></div>
          <p>Đang lấy dữ liệu thời tiết…</p>
        </div>

        <!-- Tùy chỉnh (chỉ sau khi có profile hoặc tab kịch bản) -->
        <div id="overrides-section" class="overrides" hidden>
          <button type="button" class="overrides__toggle" id="overrides-toggle" aria-expanded="false">
            <span>Tùy chỉnh kịch bản</span>
            <span class="chevron">▼</span>
          </button>
          <div id="overrides-body" class="overrides__body" hidden>
            <div class="form-grid form-grid--overrides">
              <label class="control" id="ctrl-weekday">
                <span class="control__label">Loại ngày</span>
                <select id="weekday-weekend" class="control__input" disabled></select>
              </label>
              <label class="control" id="ctrl-season">
                <span class="control__label">Mùa</span>
                <select id="season" class="control__input" disabled></select>
              </label>
              <label class="control">
                <span class="control__label">Thời tiết</span>
                <select id="weather-group" class="control__input" disabled></select>
              </label>
              <label class="control control--check">
                <input type="checkbox" id="filter-holiday" disabled />
                <span>Lọc ngày lễ</span>
              </label>
              <label class="control control--check">
                <input type="checkbox" id="filter-major" disabled />
                <span>Sự kiện lớn (16h–22h)</span>
              </label>
            </div>
            <p class="overrides__hint" id="overrides-hint"></p>
          </div>
        </div>

        <div class="form-footer">
          <div class="control">
            <span class="control__label">Trade-off</span>
            <div id="preset-btns" class="preset-row"></div>
          </div>
          <button type="submit" class="btn-primary" id="run-btn" disabled>Tối ưu lịch trình</button>
        </div>
      </form>
    </section>

    <section id="results" class="results" hidden>
      <div class="result-header">
        <h2 class="result-header__title" id="ctx-title"></h2>
        <p class="result-header__sub" id="ctx-sub"></p>
        <p class="result-header__warn" id="ctx-warn" hidden></p>
      </div>

      <div class="kpi-grid">
        <article class="kpi-card">
          <span class="kpi-card__label">Chờ TB</span>
          <span class="kpi-card__value" id="kpi-wait">—</span>
          <span class="kpi-card__unit">phút</span>
          <span class="kpi-card__delta" id="kpi-wait-d">—</span>
        </article>
        <article class="kpi-card">
          <span class="kpi-card__label">Vehicle-hours</span>
          <span class="kpi-card__value" id="kpi-vh">—</span>
          <span class="kpi-card__unit">giờ</span>
          <span class="kpi-card__delta" id="kpi-vh-d">—</span>
        </article>
        <article class="kpi-card">
          <span class="kpi-card__label">Quá tải cao điểm</span>
          <span class="kpi-card__value" id="kpi-risk">—</span>
          <span class="kpi-card__unit">%</span>
          <span class="kpi-card__delta" id="kpi-risk-d">—</span>
        </article>
      </div>

      <div class="panel panel--chart">
        <canvas id="main-chart" height="110"></canvas>
      </div>

      <div class="panel panel--table">
        <table id="hour-table">
          <thead>
            <tr>
              <th>Giờ</th>
              <th>Trips GTFS</th>
              <th>Trips AI</th>
              <th>Headway AI</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <div id="empty-state" class="empty-state">
      <div class="empty-state__icon">📅</div>
      <p>Chọn ngày để tự động lấy thời tiết và xem kịch bản</p>
    </div>
    <p id="error-state" class="error-banner" hidden></p>
  </main>
</body>
</html>
